name: CI

"on":
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  security-events: write

jobs:
  python:
    uses: mbologna/.github/.github/workflows/python-ci.yml@38f7ca7d59dad7be2dfd5607f8758cd51bb41dd2 # main
    with:
      python_version: "3.14"
      use_uv: true
      enable_codecov: false
    secrets: inherit

  docker:
    needs: python
    uses: mbologna/.github/.github/workflows/docker-ci.yml@38f7ca7d59dad7be2dfd5607f8758cd51bb41dd2 # main
    with:
      image_name: toggl-insights
      push_to_dockerhub: false
      enable_cosign: true
      enable_release_drafter: true
    secrets: inherit

  auto-release:
    # Weekly with 'commits', for whatever piled up (Renovate's chore(deps) bumps
    # included), and on every push to main with 'conventional', which releases only
    # when a feat, fix, perf, revert or breaking commit landed since the last tag:
    # a user-facing change ships without waiting for Monday, while each dependency
    # bump alone doesn't cost an image bump in infra.
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [docker]
    # contents: push the tag; actions: dispatch this workflow on it, since a
    # tag pushed with GITHUB_TOKEN triggers no run of its own.
    permissions:
      contents: write
      actions: write
    uses: mbologna/.github/.github/workflows/auto-release.yml@38f7ca7d59dad7be2dfd5607f8758cd51bb41dd2 # main
    with:
      strategy: ${{ github.event_name == 'schedule' && 'commits' || 'conventional' }}
    secrets: inherit

  cache-cleanup:
    if: github.event_name == 'schedule'
    uses: mbologna/.github/.github/workflows/cache-cleanup.yml@38f7ca7d59dad7be2dfd5607f8758cd51bb41dd2 # main
    with:
      max_age_days: 7
    permissions:
      actions: write
