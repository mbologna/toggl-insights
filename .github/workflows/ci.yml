name: CI

"on":
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on the default branch: it may be releasing, and a cut
  # release leaves a tag without its Release.
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

permissions:
  contents: read

jobs:
  # ruff, the tests with the coverage gate (fail_under in pyproject.toml)
  # and pip-audit on the locked runtime dependencies.
  python:
    uses: mbologna/.github/.github/workflows/python-ci.yml@ea61923970085662e217bf6e40c26d98185a0b42 # main
    with:
      python_version: "3.15"
      enable_codecov: false
    secrets: inherit

  docker:
    needs: python
    # Build, push, sign and scan the image; the auto-release job below releases.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: mbologna/.github/.github/workflows/docker-ci.yml@ea61923970085662e217bf6e40c26d98185a0b42 # main
    with:
      image_name: toggl-insights
      # Only release tags publish the image (auto-release dispatches
      # their build); pull requests build it without pushing.
      publish: release
      # The image must start before anything is tagged: run without network
      # or configuration, this exits 0 only when the code and its
      # dependencies import.
      smoke_cmd: 'python -c ''import toggl_insights.main, toggl_insights.alerts, toggl_insights.cleanup'''
    secrets: inherit

  # Monday's schedule tags vX.Y.Z when a feat, fix, perf, revert or breaking commit
  # landed (or a maintenance release for dependency updates), a push to main tags
  # only a CVE fix; it dispatches the tag build that publishes the X.Y.Z image.
  auto-release:
    needs: [python, docker]
    # contents: push the tag and create the Release; actions: dispatch the tag
    # build (a tag pushed with GITHUB_TOKEN triggers no run).
    permissions:
      contents: write
      actions: write
    uses: mbologna/.github/.github/workflows/auto-release.yml@ea61923970085662e217bf6e40c26d98185a0b42 # main
    with:
      strategy: conventional
      image: ghcr.io/mbologna/toggl-insights
      dockerfiles: Dockerfile
