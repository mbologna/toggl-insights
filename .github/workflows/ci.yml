name: CI

"on":
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on the default branch: it may be releasing, and a cut
  # release leaves a tag without its Release.
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

permissions:
  contents: read

jobs:
  python:
    uses: mbologna/.github/.github/workflows/python-ci.yml@37a941ea213d0c6e1c01b0fbdd626071f271ddb8 # test
    with:
      python_version: "3.15"
      enable_codecov: false
    secrets: inherit

  docker:
    needs: python
    # contents: the release tag and its Release; actions: dispatch the tag
    # build, since a tag pushed with GITHUB_TOKEN triggers no run; the rest:
    # push, sign and scan the image.
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      security-events: write
      actions: write
    uses: mbologna/.github/.github/workflows/docker-ci.yml@f73dea0e67106487f3d2d1a368845904da2846b9 # test
    with:
      image_name: toggl-insights
      # Only release tags publish the image (auto-release dispatches
      # their build); pull requests build it without pushing.
      publish: release
      push_to_dockerhub: false
      # auto-release runs inside docker-ci after the build.
      release_strategy: conventional
    secrets: inherit
